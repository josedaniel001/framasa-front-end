version: '3.8'

services:
  framasa-app:
    image: ${DOCKER_IMAGE:-josedaniel001/framasa-multiempresa-framasa-app:latest}
    container_name: framasa-erp-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      # Agregar aquí tus variables de entorno adicionales si las necesitas
      # - DATABASE_URL=${DATABASE_URL}
      # - API_URL=${API_URL}
    volumes:
      # Volumen para persistir datos si es necesario
      - ./logs:/app/logs
    networks:
      - framasa-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  framasa-network:
    driver: bridge

