version: '3.8'

services:
  framasa-app:
    image: ${DOCKER_IMAGE:-josedaniel001/framasa-multiempresa-framasa-app:latest}
    container_name: framasa-erp-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      # Variables de entorno de Next.js (build-time y runtime)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      - NEXT_PUBLIC_NEXTJS_URL=${NEXT_PUBLIC_NEXTJS_URL:-http://localhost:3000}
      # Variable de entorno para runtime en el servidor (prioritaria en rutas API)
      # IMPORTANTE: Esta variable permite configurar la URL de Django en runtime dentro del contenedor
      # Si Django está en otro contenedor, usa el nombre del servicio: http://backend:8000
      # Si Django está en otro servidor, usa la URL completa: https://api.tudominio.com
      - DJANGO_API_URL=${DJANGO_API_URL:-${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}}
      # Variables de base de datos (opcionales, solo para rutas API que aún consultan directamente DB)
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL=${DB_SSL:-false}
    volumes:
      # Volumen para persistir logs
      - ./logs:/app/logs
    networks:
      - framasa-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  framasa-network:
    driver: bridge

